steps:
  - label: ":package: Create build output"
    key: "create-artifact"
    command: |
      mkdir -p dist
      echo "Release candidate for $BUILDKITE_COMMIT" > dist/release.txt
    artifact_paths:
      - "dist/**/*"

  - block: ":raised_hand: Approve simulated deployment"
    key: "approve-deploy"
    prompt: "Review the release artifact, then approve the simulated deployment."

  - label: ":rocket: Simulated deployment"
    depends_on:
      - "approve-deploy"
    command: |
      buildkite-agent artifact download "dist/release.txt" .
      echo "Deploying:"
      cat dist/release.txt
      echo "No real environment was changed."
