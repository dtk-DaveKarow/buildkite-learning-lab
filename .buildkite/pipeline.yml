steps:
  - label: ":wave: Hello Buildkite"
    key: "hello"
    command: "./hello.sh"

  - label: ":information_source: Show CI environment"
    key: "environment"
    command: |
      echo "Build number: $BUILDKITE_BUILD_NUMBER"
      echo "Build URL: $BUILDKITE_BUILD_URL"
      echo "Repository: $BUILDKITE_REPO"
      echo "Branch: $BUILDKITE_BRANCH"
      echo "Commit: $BUILDKITE_COMMIT"
      echo "Job ID: $BUILDKITE_JOB_ID"
