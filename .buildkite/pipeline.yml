steps:
  - label: ":package: Create build output"
    key: "create-artifact"
    command: |
      mkdir -p dist
      {
        echo "Generated by Buildkite build $BUILDKITE_BUILD_NUMBER"
        echo "Commit: $BUILDKITE_COMMIT"
        echo "Timestamp: $(date -u)"
      } > dist/build-info.txt
      cat dist/build-info.txt
    artifact_paths:
      - "dist/**/*"

  - label: ":mag: Inspect build output"
    key: "inspect-artifact"
    depends_on:
      - "create-artifact"
    command: |
      buildkite-agent artifact download "dist/build-info.txt" .
      echo "Downloaded artifact:"
      cat dist/build-info.txt
