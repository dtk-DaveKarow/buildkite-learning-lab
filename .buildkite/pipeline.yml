steps:
  - block: ":clipboard: Choose a simulated environment"
    key: "approve-deploy"
    fields:
      - select: "Environment"
        key: "environment"
        options:
          - label: "Staging"
            value: "staging"
          - label: "Demo"
            value: "demo"

  - label: ":rocket: Simulated deployment"
    depends_on:
      - "approve-deploy"
    command: |
      echo "Selected environment:"
      buildkite-agent meta-data get "environment"
