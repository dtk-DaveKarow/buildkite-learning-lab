steps:
  - label: ":snail: Simulated dependency setup"
    key: "setup"
    command: |
      echo "Starting setup at $(date -u)"
      sleep 15
      echo "Finished setup at $(date -u)"

  - label: ":test_tube: Simulated test"
    key: "test"
    command: |
      echo "Starting test at $(date -u)"
      sleep 5
      echo "Finished test at $(date -u)"
